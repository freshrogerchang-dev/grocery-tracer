name: Discount Monitor

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      search:
        description: "Optional: search keyword (leave empty for the normal discount check)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  check-discounts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run discount check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_KEYWORD: ${{ github.event.inputs.search }}
        run: |
          if [ -n "$SEARCH_KEYWORD" ]; then
            python main.py --search "$SEARCH_KEYWORD"
          else
            python main.py
          fi

      - name: Commit updated price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update price history [skip ci]"
          git pull --rebase origin main
          git push
