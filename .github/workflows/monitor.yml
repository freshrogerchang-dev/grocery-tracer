name: Discount Monitor

on:
  schedule:
    # 每 6 小時跑一次（UTC 時間 0,6,12,18 點，即台灣時間 8,14,20,2 點）
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-discounts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run discount check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

         - name: Commit updated price history / watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/telegram_offset.json config/watchlist.yaml
          git diff --cached --quiet || git commit -m "chore: update price history / watchlist [skip ci]"
          git push
